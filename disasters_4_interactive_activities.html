<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Disasters · Interactive Vocabulary Practice</title><style>
:root{--ink:#1b2745;--muted:#67748d;--blue:#3959dc;--bluebg:#edf1ff;--lime:#d4f17a;--paper:#f4f6fb;--line:#e2e7f0;--good:#137d55;--bad:#bb3f4c}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 85% 3%,#e8edff 0,transparent 33%),var(--paper);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}.wrap{max-width:1040px;margin:auto;padding:28px 18px 50px}.hero{background:#1a274b;color:white;border-radius:24px;padding:29px 32px;position:relative;overflow:hidden;box-shadow:0 15px 40px #1b274410}.hero:after{content:"ALERT";position:absolute;right:-7px;top:-36px;font-size:130px;font-weight:950;letter-spacing:-.08em;color:#fff1;pointer-events:none}.eyebrow{font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.15em;color:var(--lime)}h1{font-size:clamp(29px,5vw,45px);line-height:1.04;letter-spacing:-.045em;margin:9px 0 11px}.hero p{color:#d7dfef;max-width:700px;margin:0}.score-row{display:flex;align-items:center;gap:11px;max-width:500px;margin-top:20px}.bar{flex:1;height:8px;border-radius:30px;background:#ffffff26;overflow:hidden}.bar span{display:block;width:0;height:100%;background:var(--lime);transition:width .25s}.score{font-size:13px;font-weight:850;color:#eef1f9;white-space:nowrap}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:19px 0}.tab{border:1px solid var(--line);border-radius:13px;background:white;color:var(--muted);font:inherit;font-weight:850;font-size:13px;text-align:left;padding:11px 13px;cursor:pointer;transition:.18s}.tab span{display:block;font-size:10px;letter-spacing:.1em;color:#9aa7bb;margin-bottom:3px}.tab:hover{transform:translateY(-1px);border-color:#aab8f3}.tab.active{background:var(--blue);border-color:var(--blue);color:white;box-shadow:0 8px 20px #3959dc30}.tab.active span{color:#dbe2ff}.panel{background:#fff;border:1px solid var(--line);border-radius:22px;padding:25px;min-height:420px;box-shadow:0 12px 38px #1b27440c}.head{display:flex;justify-content:space-between;align-items:flex-start;gap:17px;margin-bottom:18px}.kicker{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--blue);font-weight:950}.head h2{font-size:25px;letter-spacing:-.03em;margin:4px 0}.head p{font-size:14px;color:var(--muted);margin:0}.badge{display:inline-flex;white-space:nowrap;background:var(--bluebg);color:#3452cb;border-radius:30px;padding:6px 11px;font-size:12px;font-weight:850}.btn{border:0;border-radius:11px;background:var(--blue);color:#fff;padding:11px 16px;font:inherit;font-weight:850;cursor:pointer;transition:.16s}.btn:hover{filter:brightness(1.05);transform:translateY(-1px)}.btn.secondary{background:#edf0f6;color:#35425e}.btn:disabled{opacity:.42;cursor:not-allowed;transform:none}.row{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px}.flashgrid{display:grid;grid-template-columns:1.1fr .9fr;gap:18px}.flashcard{min-height:245px;border:0;border-radius:18px;background:linear-gradient(135deg,#edf1ff,#f8f9ff);padding:25px;text-align:left;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;justify-content:space-between}.flashcard.reveal{background:linear-gradient(135deg,#eff8de,#fbfff3)}.flashcard:hover{transform:translateY(-2px)}.big{font-size:clamp(26px,4.7vw,39px);font-weight:950;letter-spacing:-.045em;line-height:1.12}.muted{color:var(--muted);font-size:14px}.meaning{font-size:19px;font-weight:800}.example{font-size:14px;color:#53617d;margin-top:11px}.ru{font-size:14px;color:#62708a;margin-top:8px}.side{display:flex;flex-direction:column;justify-content:center;gap:12px}.side p{font-size:14px;color:var(--muted)}.matches{display:grid;grid-template-columns:1fr 1fr;gap:12px}.col{display:grid;gap:9px;align-content:start}.match{border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--ink);font:inherit;text-align:left;padding:11px 13px;min-height:56px;cursor:pointer}.match:hover{border-color:#a6b3f0;background:#fbfbff}.match.sel{border:2px solid var(--blue);background:var(--bluebg)}.match.done{background:#eff9f3;border-color:#9bd7b4;color:#1b6647}.num{display:inline-grid;place-items:center;width:23px;height:23px;border-radius:7px;background:#f0f2f7;color:#76839b;font-size:11px;font-weight:900;margin-right:8px}.feedback{min-height:22px;margin-top:10px;font-size:13px;font-weight:850}.good{color:var(--good)}.bad{color:var(--bad)}.sortintro{font-size:14px;color:var(--muted);margin:-5px 0 12px}.wordbank{display:flex;flex-wrap:wrap;gap:8px;padding:13px;border-radius:14px;background:#f5f7fc;border:1px solid #edf0f6;min-height:64px}.word{border:1px solid #dce2ef;border-radius:10px;background:white;padding:8px 11px;color:var(--ink);font:inherit;font-size:14px;font-weight:750;cursor:pointer}.word:hover{border-color:#98a8f1}.word.selected{background:var(--bluebg);border-color:var(--blue);color:#2d4cca}.word.used{display:none}.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:13px}.cat{min-height:130px;border:1px dashed #bbc6da;border-radius:14px;background:#fafbfe;padding:12px;cursor:pointer;transition:.15s}.cat:hover{border-color:var(--blue);background:#f6f8ff}.cat.target{border:2px solid var(--blue);background:var(--bluebg)}.cat-title{font-size:13px;font-weight:900;margin-bottom:7px}.cat small{display:block;font-size:11px;color:var(--muted);margin-bottom:8px}.cat-words{display:flex;flex-wrap:wrap;gap:5px}.chip{font-size:11px;background:#eaf5ee;color:#216544;border-radius:20px;padding:3px 7px}.question{border:1px solid #edf0f6;background:#f8f9fc;border-radius:15px;padding:18px;margin:12px 0}.qtag{font-size:11px;text-transform:uppercase;letter-spacing:.1em;font-weight:900;color:var(--blue)}.qtext{font-size:18px;font-weight:680;margin:8px 0 14px}.options{display:grid;gap:8px}.option{border:1px solid var(--line);border-radius:10px;background:white;padding:10px 13px;text-align:left;color:var(--ink);font:inherit;cursor:pointer}.option:hover{border-color:#a2aff0}.option.correct{background:#eaf8ef;border-color:#7ac699;color:#176241}.option.incorrect{background:#fff0f1;border-color:#e29ba4;color:#9c3342}.option:disabled{cursor:default}.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:16px;color:var(--muted);font-size:12px}.foot button{border:0;background:transparent;color:var(--blue);font:inherit;font-weight:850;cursor:pointer}.note{font-size:12px;color:#707d93;margin-top:9px}.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:700px){.wrap{padding:16px 12px 35px}.hero{padding:23px 19px}.hero:after{font-size:85px;top:-10px}.tabs{grid-template-columns:repeat(2,1fr);gap:7px}.tab{padding:10px;font-size:12px}.panel{padding:18px 14px}.head{display:block}.badge{margin-top:10px}.flashgrid{grid-template-columns:1fr}.side{display:grid;grid-template-columns:1fr 1fr}.side p{grid-column:1/-1;margin-bottom:0}.matches{gap:7px}.match{padding:9px;font-size:13px}.cats{grid-template-columns:repeat(2,1fr)}.cat{min-height:120px}.foot{align-items:flex-start}}
</style></head><body><main class="wrap"><header class="hero"><div class="eyebrow">English vocabulary · disasters</div><h1>Learn the words.<br>Know what they describe.</h1><p>Practise all 12 disaster terms with flashcards, meaning matches, a spidergram sort, and sentence clues.</p><div class="score-row"><div class="bar"><span id="progress"></span></div><div class="score" id="score">0 of 24 correct</div></div></header><nav class="tabs" aria-label="Choose an activity"><button class="tab active" data-tab="1"><span>ACTIVITY 01</span>Flashcards</button><button class="tab" data-tab="2"><span>ACTIVITY 02</span>Match meanings</button><button class="tab" data-tab="3"><span>ACTIVITY 03</span>Spidergram sort</button><button class="tab" data-tab="4"><span>ACTIVITY 04</span>Choose the word</button></nav><section class="panel" id="panel" aria-live="polite"></section><footer class="foot"><span>Note: sort by the most typical cause or setting; some disasters can have more than one cause.</span><button id="reset">↻ Reset all progress</button></footer></main><script>
const terms=[
 {word:'rail accident',def:'A serious incident involving a train or railway.',ru:'железнодорожная авария',ex:'Investigators examined the tracks after the rail accident.'},
 {word:'tsunami',def:'A series of very large sea waves, often caused by an undersea earthquake.',ru:'цунами',ex:'The coastal community moved to higher ground after a tsunami warning.'},
 {word:'earthquake',def:'A sudden shaking of the ground caused by movement in the Earth’s crust.',ru:'землетрясение',ex:'The earthquake caused buildings to sway.'},
 {word:'landslide',def:'A mass of earth, rock, or mud that slides down a slope.',ru:'оползень',ex:'Heavy rain triggered a landslide on the hillside.'},
 {word:'flood',def:'A large amount of water covering land that is usually dry.',ru:'наводнение',ex:'The river rose quickly during the flood.'},
 {word:'freak storm',def:'An unusual and unexpectedly powerful storm.',ru:'необычно сильный шторм',ex:'A freak storm brought sudden strong winds to the area.'},
 {word:'building fire',def:'A fire that spreads inside or through a building.',ru:'пожар в здании',ex:'Residents left the building safely during the building fire.'},
 {word:'factory explosion',def:'A sudden violent burst inside an industrial workplace.',ru:'взрыв на заводе',ex:'Emergency crews responded to a factory explosion.'},
 {word:'plane crash',def:'An accident in which an aircraft hits the ground or another object.',ru:'авиакатастрофа',ex:'The plane crash was reported in the evening news.'},
 {word:'avalanche',def:'A large mass of snow and ice sliding rapidly down a mountain.',ru:'лавина',ex:'Skiers were warned about avalanche danger.'},
 {word:'road accident',def:'A collision or other harmful incident involving road vehicles.',ru:'ДТП; дорожная авария',ex:'Traffic slowed after a road accident.'},
 {word:'volcanic eruption',def:'The release of lava, ash, and gases from a volcano.',ru:'извержение вулкана',ex:'The volcanic eruption sent ash high into the air.'}
];
const categories=[{name:'Earth & sea hazards',hint:'Ground, mountain, or ocean',items:['tsunami','earthquake','landslide','avalanche','volcanic eruption']},{name:'Weather & water events',hint:'Storms and excess water',items:['flood','freak storm']},{name:'Transport accidents',hint:'Rail, road, or air travel',items:['rail accident','plane crash','road accident']},{name:'Building & industrial incidents',hint:'Buildings and workplaces',items:['building fire','factory explosion']}];
const quiz=[
 {q:'A train derails or collides with another train. What is this called?',a:'rail accident',o:['rail accident','road accident','plane crash']},
 {q:'A series of giant sea waves is caused by movement under the ocean.',a:'tsunami',o:['flood','tsunami','freak storm']},
 {q:'The ground shakes suddenly because of movement in the Earth’s crust.',a:'earthquake',o:['landslide','earthquake','volcanic eruption']},
 {q:'After days of rain, a mass of mud and rock slides down a hillside.',a:'landslide',o:['landslide','avalanche','flood']},
 {q:'A river overflows and covers normally dry land.',a:'flood',o:['flood','tsunami','freak storm']},
 {q:'An unusually powerful storm arrives unexpectedly.',a:'freak storm',o:['freak storm','factory explosion','volcanic eruption']},
 {q:'A fire spreads through a block of flats.',a:'building fire',o:['building fire','factory explosion','rail accident']},
 {q:'There is a sudden blast at an industrial plant.',a:'factory explosion',o:['plane crash','factory explosion','building fire']},
 {q:'An aircraft is involved in a serious accident after hitting the ground.',a:'plane crash',o:['rail accident','plane crash','road accident']},
 {q:'A large mass of snow rushes down a mountain slope.',a:'avalanche',o:['landslide','avalanche','tsunami']},
 {q:'Two cars collide on a city street.',a:'road accident',o:['rail accident','road accident','plane crash']},
 {q:'A volcano releases lava, ash, and gases.',a:'volcanic eruption',o:['earthquake','freak storm','volcanic eruption']}
];
let tab=1,fi=0,flip=false,matched=new Set(),selected=null,sorted=new Set(),qi=0,quizScore=0,total=0;
function award(){total=Math.min(24,total+1);document.getElementById('score').textContent=total+' of 24 correct';document.getElementById('progress').style.width=(total/24*100)+'%'}
function render(){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',+b.dataset.tab===tab));if(tab===1)flash();if(tab===2)match();if(tab===3)sort();if(tab===4)choose()}
function flash(){const t=terms[fi];document.getElementById('panel').innerHTML=`<div class="head"><div><div class="kicker">Activity 01 · Learn the terms</div><h2>Flashcards</h2><p>Try to recall the definition before you flip.</p></div><span class="badge">CARD ${fi+1} / 12</span></div><div class="flashgrid"><button class="flashcard ${flip?'reveal':''}" id="flip"><span class="big">${flip?t.def:t.word}</span><span>${flip?`<span class="example"><b>Example:</b> ${t.ex}</span><span class="ru">Russian: ${t.ru}</span>`:'<span class="muted">Tap to reveal the definition ↻</span>'}</span></button><div class="side"><p><b>Memory tip:</b> say the word aloud, then picture the event. For multi-word terms, learn the whole phrase as one chunk.</p><button class="btn" id="next">${fi===11?'Start again':'Next card'} →</button><button class="btn secondary" id="random">↻ Random card</button></div></div>`;document.getElementById('flip').onclick=()=>{flip=!flip;flash()};document.getElementById('next').onclick=()=>{fi=(fi+1)%12;flip=false;flash()};document.getElementById('random').onclick=()=>{fi=Math.floor(Math.random()*12);flip=false;flash()}}
const order=[7,1,9,4,0,11,3,8,5,2,10,6];function match(){document.getElementById('panel').innerHTML=`<div class="head"><div><div class="kicker">Activity 02 · Link word and meaning</div><h2>Match each term to its definition</h2><p>Tap a word, then tap its matching description.</p></div><span class="badge">${matched.size} / 12 matched</span></div><div class="matches"><div class="col">${terms.map((t,i)=>`<button class="match ${matched.has(i)?'done':''} ${selected===i?'sel':''}" data-word="${i}" ${matched.has(i)?'disabled':''}><span class="num">${i+1}</span><b>${t.word}</b></button>`).join('')}</div><div class="col">${order.map((id,j)=>`<button class="match ${matched.has(id)?'done':''}" data-def="${id}" ${matched.has(id)?'disabled':''}><span class="num">${String.fromCharCode(65+j)}</span>${terms[id].def}</button>`).join('')}</div></div><div class="feedback" id="matchFeedback">${matched.size===12?'Every term matched—great work!':'Select a word to begin.'}</div><div class="row"><button class="btn secondary" id="retry">↻ Match again</button></div>`;document.querySelectorAll('[data-word]').forEach(b=>b.onclick=()=>{selected=+b.dataset.word;match()});document.querySelectorAll('[data-def]').forEach(b=>b.onclick=()=>{const id=+b.dataset.def,fb=document.getElementById('matchFeedback');if(selected===null){fb.textContent='Choose a word first.';return}if(id===selected){matched.add(id);selected=null;award();match();const f=document.getElementById('matchFeedback');f.className='feedback good';f.textContent='Correct: '+terms[id].word+' — '+terms[id].def}else{fb.className='feedback bad';fb.textContent='Not that definition—try again.';b.classList.add('wrong');setTimeout(()=>b.classList.remove('wrong'),350)}});document.getElementById('retry').onclick=()=>{matched.clear();selected=null;match()}}
function sort(){const remaining=terms.map((t,i)=>({t,i})).filter(x=>!sorted.has(x.t.word));document.getElementById('panel').innerHTML=`<div class="head"><div><div class="kicker">Activity 03 · Build the spidergram</div><h2>Sort the disasters by typical cause or setting</h2><p>Choose a word, then choose the best-fitting branch of the spidergram.</p></div><span class="badge">${sorted.size} / 12 sorted</span></div><p class="sortintro">Select a term below, then tap a category box. You can retry a wrong category.</p><div class="wordbank">${remaining.map(x=>`<button class="word ${selected===x.i?'selected':''}" data-sortword="${x.i}">${x.t.word}</button>`).join('')||'<b>All terms sorted!</b>'}</div><div class="cats">${categories.map((c,ci)=>{const members=[...sorted].filter(w=>c.items.includes(w));return `<button class="cat" data-cat="${ci}"><div class="cat-title">${c.name}</div><small>${c.hint}</small><div class="cat-words">${members.map(w=>`<span class="chip">${w}</span>`).join('')}</div></button>`}).join('')}</div><div class="feedback" id="sortFeedback">${sorted.size===12?'Spidergram complete—nice sorting!':'Pick a word from the bank.'}</div><div class="note">Typical grouping: a tsunami is placed with earth/sea hazards; floods and storms can have multiple causes.</div><div class="row"><button class="btn secondary" id="resetSort">↻ Start sorting again</button></div>`;document.querySelectorAll('[data-sortword]').forEach(b=>b.onclick=()=>{selected=+b.dataset.sortword;sort()});document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{const ci=+b.dataset.cat,fb=document.getElementById('sortFeedback');if(selected===null){fb.textContent='Select a term from the word bank first.';return}const w=terms[selected].word;if(categories[ci].items.includes(w)){sorted.add(w);selected=null;award();sort();const f=document.getElementById('sortFeedback');f.className='feedback good';f.textContent='Correct branch! '+w+' belongs under “'+categories[ci].name+'”.'}else{fb.className='feedback bad';fb.textContent='Try another branch—think about the typical setting or cause.';b.classList.add('target');setTimeout(()=>b.classList.remove('target'),350)}});document.getElementById('resetSort').onclick=()=>{sorted.clear();selected=null;sort()}}
function choose(){if(qi>=quiz.length){document.getElementById('panel').innerHTML=`<div class="head"><div><div class="kicker">Activity 04 · Use the vocabulary</div><h2>Quiz complete</h2><p>You got ${quizScore} of ${quiz.length} correct.</p></div><span class="badge">${quizScore} / 12</span></div><div class="question">${quizScore===12?'Brilliant—you recognized every disaster.':quizScore>=9?'Great work. Review any words that were difficult, then play again.':'Keep practising: use the flashcards and matching activity before another round.'}</div><button class="btn" id="again">↻ Play again</button>`;document.getElementById('again').onclick=()=>{qi=0;quizScore=0;choose()};return}const q=quiz[qi];document.getElementById('panel').innerHTML=`<div class="head"><div><div class="kicker">Activity 04 · Identify the event</div><h2>Choose the disaster word</h2><p>Read the clue and pick the matching term.</p></div><span class="badge">QUESTION ${qi+1} / ${quiz.length}</span></div><div class="question"><div class="qtag">What is being described?</div><div class="qtext">${q.q}</div><div class="options">${q.o.map((x,i)=>`<button class="option" data-option="${i}">${x}</button>`).join('')}</div><div class="feedback" id="quizFeedback"></div></div><button class="btn" id="nextQ" disabled>${qi===quiz.length-1?'See result':'Next question'} →</button>`;let done=false;document.querySelectorAll('[data-option]').forEach((b,i)=>b.onclick=()=>{if(done)return;done=true;const ok=q.o[i]===q.a;b.classList.add(ok?'correct':'incorrect');document.querySelectorAll('[data-option]').forEach((x,j)=>{x.disabled=true;if(q.o[j]===q.a)x.classList.add('correct')});const f=document.getElementById('quizFeedback');f.className='feedback '+(ok?'good':'bad');f.textContent=ok?'Correct! The answer is '+q.a+'.':'Not quite—the answer is '+q.a+'.';if(ok){quizScore++;award()}document.getElementById('nextQ').disabled=false});document.getElementById('nextQ').onclick=()=>{qi++;choose()}}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=+b.dataset.tab;render()});document.getElementById('reset').onclick=()=>{fi=0;flip=false;matched.clear();sorted.clear();selected=null;qi=0;quizScore=0;total=0;document.getElementById('score').textContent='0 of 24 correct';document.getElementById('progress').style.width='0%';tab=1;render()};render();
</script></body></html>
